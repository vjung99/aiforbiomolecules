<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Archive of past sessions from the SIB AI Models of Biomolecules focus group.">
    <title>Event Archive | AI Models of Biomolecules</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/site.css">
</head>
<body>
    <div class="page">
        <nav class="site-nav">
            <a class="badge" href="https://www.sib.swiss/community/network/ai-models-of-biomolecules-focus-group" target="_blank" rel="noopener noreferrer">
                <span class="badge-dot" aria-hidden="true"></span>
                SIB · Focus Group
            </a>
            <div class="site-nav-links">
                <a href="../">Home</a>
                <a href="./" aria-current="page">Archive</a>
            </div>
        </nav>

        <header>
            <h1 class="page-title">Event archive</h1>
            <p class="page-subtitle">
                Past sessions from the AI Models of Biomolecules focus group.
            </p>
        </header>

        <main>
            <div id="past-events" class="archive-grid" aria-live="polite"></div>
        </main>

        <footer>
            <p>
                <a href="../">Back to home</a> ·
                <a href="https://www.sib.swiss/community/network/ai-models-of-biomolecules-focus-group" target="_blank" rel="noopener noreferrer">SIB focus group page</a>
            </p>
        </footer>
    </div>

    <script src="../js/events.js"></script>
    <script>
        loadEvents("../data/events.json")
            .then((data) => renderPastEvents(document.getElementById("past-events"), data.past))
            .catch(() => {
                document.getElementById("past-events").innerHTML =
                    "<p class=\"page-subtitle\">Unable to load events. Please try again later.</p>";
            });
    </script>
</body>
</html>
